name = "sawa-deploy-test"
main = "worker-3.js"
compatibility_date = "2025-06-01"
# C307: keep variables added in the Cloudflare dashboard (a deploy from GitHub used to wipe Text-type ones)
keep_vars = true
[vars]
TURN_PROVIDER = "pair"

[triggers]
crons = ["*/5 * * * *"]

# C326: وسائط المحادثات (فيديو · صور · ملفّات) — أنشئ الحاوية sawa-media في Cloudflare ← R2 قبل النشر
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "sawa-media"
