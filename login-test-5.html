<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبار الدخول — سوا</title>
<style>
  :root{
    --bg:#0c4854; --card:#0f5563; --ink:#eaf4f2; --soft:#9dc4c0;
    --line:#1c6675; --accent:#38a878; --accent-ink:#062b21;
    --err:#e07d70; --ok:#4fb883; --field:#0a3d47;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:system-ui,"Segoe UI",Tahoma,sans-serif;line-height:1.6;
    display:flex;align-items:flex-start;justify-content:center;padding:24px 16px}
  .wrap{width:100%;max-width:420px}
  h1{font-size:1.35rem;margin:0 0 4px}
  .sub{color:var(--soft);font-size:.9rem;margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px 16px;margin-bottom:16px}
  .step{font-size:.75rem;letter-spacing:.08em;color:var(--accent);
    font-weight:700;margin:0 0 10px}
  label{display:block;font-size:.85rem;color:var(--soft);margin:0 0 6px}
  input{width:100%;padding:12px 14px;font-size:1.05rem;border-radius:11px;
    border:1.5px solid var(--line);background:var(--field);color:var(--ink);
    margin-bottom:12px;direction:ltr;text-align:left}
  input:focus{outline:none;border-color:var(--accent)}
  button{width:100%;padding:12px;font-size:1rem;font-weight:700;border:none;
    border-radius:11px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--soft)}
  #step2{opacity:.4;pointer-events:none}
  #step2.on{opacity:1;pointer-events:auto}
  .log{background:#062b33;border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;font-size:.85rem;min-height:52px;white-space:pre-wrap;
    word-break:break-word;direction:ltr;text-align:left;font-family:ui-monospace,monospace}
  .ok{color:var(--ok)} .err{color:var(--err)}
  .hint{font-size:.8rem;color:var(--soft);margin:10px 0 0}
</style>
</head>
<body>
  <div class="wrap">
    <h1>اختبار الدخول</h1>
    <p class="sub">سوا · طبقة الحسابات · Firebase Phone Auth</p>

    <div class="card">
      <p class="step">① الرقم</p>
      <label>رقم الجوال (صيغة دولية)</label>
      <input id="phone" type="tel" inputmode="tel" value="+249" placeholder="+2499XXXXXXXX">
      <button id="sendBtn">أرسل الرمز</button>
    </div>

    <div class="card" id="step2">
      <p class="step">② الرمز</p>
      <label>الرمز الواصل بالرسالة</label>
      <input id="code" type="text" inputmode="numeric" placeholder="123456">
      <button id="verifyBtn">تأكيد الدخول</button>
    </div>

    <div class="card">
      <p class="step">النتيجة</p>
      <div class="log" id="log">بانتظار…</div>
      <button class="ghost" id="outBtn" style="margin-top:12px">تسجيل الخروج</button>
      <p class="hint">⛔ إن فشل بـ auth/… تأكّد أنّ نطاق netlify.app مضاف في:
        Firebase → Authentication → Settings → Authorized domains.</p>
    </div>
  </div>

  <!-- reCAPTCHA غير المرئي يعمل هنا -->
  <div id="recaptcha"></div>

  <!-- ⬇️ طابق رقم النسخة مع تعليق sawa-auth.js -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="sawa-auth.js"></script>

  <script>
    var logEl = document.getElementById("log");
    function log(msg, cls){ logEl.textContent = msg; logEl.className = "log " + (cls||""); }

    // يعرض حالة الدخول الحاليّة باستمرار
    try {
      SawaAuth.onUser(function(user){
        if (user) {
          log("✓ داخل\nuid: " + user.uid +
              "\nphone: " + (user.phoneNumber||"—") +
              "\nوثيقة الحساب: أُنشئت/حُدّثت (راجع Firestore).", "ok");
        } else {
          log("خارج — لم يُسجَّل دخول بعد.");
        }
      });
    } catch (e) { log("خطأ في التهيئة: " + e.message +
      "\nتأكّد من لصق config في sawa-auth.js.", "err"); }

    var sendBtn = document.getElementById("sendBtn");
    var verifyBtn = document.getElementById("verifyBtn");
    var step2 = document.getElementById("step2");

    sendBtn.addEventListener("click", function(){
      var phone = document.getElementById("phone").value.trim();
      if (!/^\+\d{8,15}$/.test(phone)) { log("رقم غير صحيح — استعمل الصيغة الدولية +249…", "err"); return; }
      sendBtn.disabled = true; log("جارٍ الإرسال…");
      SawaAuth.startPhoneSignIn(phone, "recaptcha").then(function(){
        log("✓ أُرسل الرمز إلى " + phone + " — أدخله في الخطوة ②.", "ok");
        step2.classList.add("on");
      }).catch(function(e){
        log("فشل الإرسال: " + (e.code||"") + "\n" + e.message, "err");
      }).finally(function(){ sendBtn.disabled = false; });
    });

    verifyBtn.addEventListener("click", function(){
      var code = document.getElementById("code").value.trim();
      if (!/^\d{4,8}$/.test(code)) { log("رمز غير صحيح.", "err"); return; }
      verifyBtn.disabled = true; log("جارٍ التأكيد…");
      SawaAuth.confirmCode(code).then(function(user){
        // onUser سيعرض النتيجة
      }).catch(function(e){
        log("فشل التأكيد: " + (e.code||"") + "\n" + e.message, "err");
      }).finally(function(){ verifyBtn.disabled = false; });
    });

    document.getElementById("outBtn").addEventListener("click", function(){
      SawaAuth.signOut().then(function(){ location.reload(); });
    });
  </script>
</body>
</html>
